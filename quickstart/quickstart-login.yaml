appType: "m2m"
technology: "m2m"
technologyLabel: "Machine-to-Machine"

inputs:
  auth0Domain:
  auth0ClientId:
  auth0ClientSecret:
  auth0Audience:
  auth0Scope:
  selectedApi:
  apiEndpoint:

placeholders:
  "%AUTH0_DOMAIN%":
    inputKey: "auth0Domain"
  "%AUTH0_CLIENT_ID%":
    inputKey: "auth0ClientId"
  "%AUTH0_CLIENT_SECRET%":
    inputKey: "auth0ClientSecret"
  "%AUTH0_AUDIENCE%":
    inputKey: "auth0Audience"
  "%AUTH0_SCOPE%":
    inputKey: "auth0Scope"
  "%SELECTED_API%":
    inputKey: "selectedApi"
  "%API_ENDPOINT%":
    inputKey: "apiEndpoint"

snippets:
  envBash: &envBash
    label: "macOS / Linux"
    platform: "unix"
    content: |
      export AUTH0_CLIENT_SECRET="%AUTH0_CLIENT_SECRET%"
    language: "bash"
  envPowershell: &envPowershell
    label: "PowerShell"
    platform: "windows"
    content: |
      $env:AUTH0_CLIENT_SECRET="%AUTH0_CLIENT_SECRET%"
    language: "bash"
  envCmd: &envCmd
    label: "Windows CMD"
    content: |
      set AUTH0_CLIENT_SECRET=%AUTH0_CLIENT_SECRET%
    language: "bash"
  m2mCsharp: &m2mCsharp
    source: "csharp/m2m.cs"
    language: "csharp"
  m2mGo: &m2mGo
    source: "go/m2m.go"
    language: "go"
  m2mJava: &m2mJava
    source: "java/m2m.java"
    language: "java"
  m2mNode: &m2mNode
    source: "node/m2m.js"
    language: "nodejs"
  m2mPhp: &m2mPhp
    source: "php/m2m.php"
    language: "php"
  m2mPython: &m2mPython
    source: "python/m2m.py"
    language: "python"
  m2mRuby: &m2mRuby
    source: "ruby/m2m.rb"
    language: "ruby"
  runCsharp: &runCsharp
    source: "csharp/run.sh"
    language: "bash"
    technology: "csharp"
  runGo: &runGo
    source: "go/run.sh"
    language: "bash"
    technology: "go"
  runJava: &runJava
    source: "java/run.sh"
    language: "bash"
    technology: "java"
  runNode: &runNode
    source: "node/run.sh"
    language: "bash"
    technology: "nodejs"
  runPhp: &runPhp
    source: "php/run.sh"
    language: "bash"
    technology: "php"
  runPython: &runPython
    source: "python/run.sh"
    language: "bash"
    technology: "python"
  runRuby: &runRuby
    source: "ruby/run.sh"
    language: "bash"
    technology: "ruby"

steps:
  - title: "Set your credentials"
    contentBlocks:
      - type: snippet
        group: "os"
        sources:
          - <<: *envBash
          - <<: *envPowershell
          - <<: *envCmd
  - title: "Obtaining an Access Token & Calling your API"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/obtain-access-token.md"
      - type: markdown
        source: "quickstart/markdown/access-api.md"
      - type: snippet
        sources:
          - <<: *m2mCsharp
          - <<: *m2mGo
          - <<: *m2mJava
          - <<: *m2mNode
          - <<: *m2mPhp
          - <<: *m2mPython
          - <<: *m2mRuby
  - title: "Run"
    contentBlocks:
      - type: snippet
        sources:
          - <<: *runCsharp
          - <<: *runGo
          - <<: *runJava
          - <<: *runNode
          - <<: *runPhp
          - <<: *runPython
          - <<: *runRuby

nextSteps:
  links:
    - label: "Self-Service Machine-to-Machine"
      url: "https://auth0.com/docs/get-started/onboarding/self-service-m2m"
    - label: "Using Machine to Machine (M2M) Authorization"
      url: "https://auth0.com/blog/using-m2m-authorization/"

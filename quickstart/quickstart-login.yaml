appType: "m2m"
technology: "m2m"
technologyLabel: "Machine-to-Machine"
defaultEnvFileName: &defaultEnvFileName ".env.local"

inputs:
  auth0Domain:
  auth0ClientId:
  auth0ClientSecret:
  auth0Audience:
  auth0Scope:
  selectedApi:
  apiEndpoint:

placeholders:
  "%AUTH0_DOMAIN%":
    inputKey: "auth0Domain"
  "%AUTH0_CLIENT_ID%":
    inputKey: "auth0ClientId"
  "%AUTH0_CLIENT_SECRET%":
    inputKey: "auth0ClientSecret"
  "%AUTH0_AUDIENCE%":
    inputKey: "auth0Audience"
  "%AUTH0_SCOPE%":
    inputKey: "auth0Scope"
  "%SELECTED_API%":
    inputKey: "selectedApi"
  "%API_ENDPOINT%":
    inputKey: "apiEndpoint"

snippets:
  env: &env
    fileName: *defaultEnvFileName
    content: |
      AUTH0_DOMAIN=%AUTH0_DOMAIN%
      AUTH0_CLIENT_ID=%AUTH0_CLIENT_ID%
      AUTH0_CLIENT_SECRET=%AUTH0_CLIENT_SECRET%
      AUTH0_AUDIENCE=%AUTH0_AUDIENCE%
      AUTH0_SCOPE=%AUTH0_SCOPE%
    language: "bash"
  curlGetToken: &curlGetToken
    source: "quickstart/snippets/curl-get-token.sh"
    language: "bash"
  curlCallApi: &curlCallApi
    source: "quickstart/snippets/curl-call-api.sh"
    language: "bash"
  csharpGetToken: &csharpGetToken
    source: "quickstart/snippets/csharp-get-token.cs"
    language: "csharp"
  csharpCallApi: &csharpCallApi
    source: "quickstart/snippets/csharp-call-api.cs"
    language: "csharp"
  goGetToken: &goGetToken
    source: "quickstart/snippets/go-get-token.go"
    language: "go"
  goCallApi: &goCallApi
    source: "quickstart/snippets/go-call-api.go"
    language: "go"
  javaGetToken: &javaGetToken
    source: "quickstart/snippets/java-get-token.java"
    language: "java"
  javaCallApi: &javaCallApi
    source: "quickstart/snippets/java-call-api.java"
    language: "java"
  nodeGetToken: &nodeGetToken
    source: "quickstart/snippets/node-get-token.js"
    language: "nodejs"
  nodeCallApi: &nodeCallApi
    source: "quickstart/snippets/node-call-api.js"
    language: "nodejs"
  phpGetToken: &phpGetToken
    source: "quickstart/snippets/php-get-token.php"
    language: "php"
  phpCallApi: &phpCallApi
    source: "quickstart/snippets/php-call-api.php"
    language: "php"
  pythonGetToken: &pythonGetToken
    source: "quickstart/snippets/python-get-token.py"
    language: "python"
  pythonCallApi: &pythonCallApi
    source: "quickstart/snippets/python-call-api.py"
    language: "python"
  rubyGetToken: &rubyGetToken
    source: "quickstart/snippets/ruby-get-token.rb"
    language: "ruby"
  rubyCallApi: &rubyCallApi
    source: "quickstart/snippets/ruby-call-api.rb"
    language: "ruby"


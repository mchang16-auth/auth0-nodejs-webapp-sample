steps:
  - title: "Configure environment variables"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/env-config.md"
      - type: snippet
        <<: *env
  - title: "Obtaining an Access Token"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/obtain-access-token.md"
      - type: snippet
        sources:
          - <<: *curlGetToken
          - <<: *csharpGetToken
          - <<: *goGetToken
          - <<: *javaGetToken
          - <<: *nodeGetToken
          - <<: *phpGetToken
          - <<: *pythonGetToken
          - <<: *rubyGetToken
  - title: "Calling your API"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/access-api.md"
      - type: snippet
        sources:
          - <<: *curlCallApi
          - <<: *csharpCallApi
          - <<: *goCallApi
          - <<: *javaCallApi
          - <<: *nodeCallApi
          - <<: *phpCallApi
          - <<: *pythonCallApi
          - <<: *rubyCallApi

